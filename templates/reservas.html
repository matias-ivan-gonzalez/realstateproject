{% extends "base_hero.html" %}

{% block title %}Mis Reservas - Alquilando{% endblock %}

{% block hero_content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4 text-center">Gestión de reservas</h2>
            <div class="row g-3">
                <div class="mb-3 d-flex gap-3">
                    <button id="btn-futuras" class="btn btn-outline-primary">Reservas futuras</button>
                    <button id="btn-curso" class="btn btn-outline-success">Reservas en curso</button>
                </div>
                <div id="listado-reservas" class="mt-3"></div>
            </div>
            <script>
                // Datos de reservas desde Jinja2 a JS
                var reservas = {{ reservas|tojson }};
                var currentDate = new Date("{{ current_date.strftime('%Y-%m-%d') }}");
                var listado = document.getElementById('listado-reservas');
                var btnFuturas = document.getElementById('btn-futuras');
                var btnCurso = document.getElementById('btn-curso');

                function renderReservas(filtro) {
                    var filtradas = reservas.filter(filtro);
                    if (filtradas.length === 0) {
                        listado.innerHTML = '<div class="alert alert-info text-center">No hay reservas para mostrar.</div>';
                        return;
                    }
                    var html = '<table class="table table-striped"><thead><tr>' +
                        '<th>Propiedad</th><th>Dirección</th><th>Fecha Inicio</th><th>Fecha Fin</th><th>Cantidad de Personas</th><th>Acciones</th></tr></thead><tbody>';
                    filtradas.forEach(function(reserva) {
                        html += '<tr>' +
                            '<td>' + reserva.propiedad + '</td>' +
                            '<td>' + reserva.direccion + '</td>' +
                            '<td>' + reserva.fecha_inicio_str + '</td>' +
                            '<td>' + reserva.fecha_fin_str + '</td>' +
                            '<td>' + reserva.cantidad_personas + '</td>' +
                            '<td>';
                        // Acciones (badge de calificada o no)
                        if (reserva.calificacion === true) {
                            html += '<span class="badge bg-success">Calificada</span> ';
                        } else {
                            html += '<span class="badge bg-danger">No calificada</span> ';
                        }
                        // Icono de chat: 2 chats distintos según el tipo de reserva
                        var tipoChat = '';
                        if (new Date(reserva.fecha_inicio) > currentDate) {
                            tipoChat = 'futuro';
                        } else {
                            tipoChat = 'curso';
                        }
                        var chatKey = 'chat_iniciado_' + tipoChat;
                        var chatIniciado = reserva[chatKey] === true;
                        if (chatIniciado) {
                            html += '<button class="btn btn-sm btn-outline-primary iniciar-chat-btn" data-reserva-id="' + reserva.id + '" data-chat-iniciado="1" data-tipo-chat="' + tipoChat + '" title="Ver chat"><i class="bi bi-chat-dots"></i> Ver chat ' + (tipoChat === 'futuro' ? '(Futuro)' : '(En curso)') + '</button>';
                        } else {
                            html += '<button class="btn btn-sm btn-outline-secondary iniciar-chat-btn" data-reserva-id="' + reserva.id + '" data-chat-iniciado="0" data-tipo-chat="' + tipoChat + '" title="Iniciar chat"><i class="bi bi-chat"></i> Iniciar chat ' + (tipoChat === 'futuro' ? '(Futuro)' : '(En curso)') + '</button>';
                        }
                        html += '</td></tr>';
                    });
                    html += '</tbody></table>';
                    listado.innerHTML = html;
                }

                btnFuturas.onclick = function() {
                    renderReservas(function(r) {
                        // Futuras: fecha_inicio > hoy
                        return new Date(r.fecha_inicio) > currentDate;
                    });
                };
                btnCurso.onclick = function() {
                    renderReservas(function(r) {
                        // En curso: fecha_inicio <= hoy && fecha_fin >= hoy
                        var inicio = new Date(r.fecha_inicio);
                        var fin = new Date(r.fecha_fin);
                        return inicio <= currentDate && fin >= currentDate;
                    });
                };
                // Mostrar futuras por defecto
                // Delegar click en los botones de chat
                listado.addEventListener('click', function(e) {
                    var btn = e.target.closest('.iniciar-chat-btn');
                    if (btn) {
                        var reservaId = btn.getAttribute('data-reserva-id');
                        var chatIniciado = btn.getAttribute('data-chat-iniciado') === '1';
                        var tipoChat = btn.getAttribute('data-tipo-chat');
                        // Redirigir a la vista de chat, pasando el tipo de chat
                        if (chatIniciado) {
                            window.location.href = '/chat?reserva_id=' + reservaId + '&tipo=' + tipoChat;
                        } else {
                            window.location.href = '/chat?reserva_id=' + reservaId + '&iniciar=1&tipo=' + tipoChat;
                        }
                    }
                });
                btnFuturas.click();
            </script>
        </div>
    </div>
</div>
{% endblock %}

<!-- Bootstrap Icons CDN para los íconos de chat -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Script de Bootstrap solo para esta vista -->
<script src="/static/js/bootstrap.bundle.min.js"></script>
