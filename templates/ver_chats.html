{% extends "base_hero.html" %}
{% block title %}Ver Chats{% endblock %}
{% block hero_content %}
<div class="container mt-4">
    <h2 class="mb-4">Gestión de Chats</h2>
    <div class="mb-3 d-flex gap-3">
        <button id="btn-futuras" class="btn btn-outline-primary">Chats con reservas a futuro</button>
        <button id="btn-curso" class="btn btn-outline-success">Chats con reservas en curso</button>
        <button id="btn-futuras-cerradas" class="btn btn-outline-secondary">Chats con reservas a futuro cerrados</button>
        <button id="btn-curso-cerradas" class="btn btn-outline-secondary">Chats con reservas en curso cerrados</button>
    </div>
    <div id="listado-chats" class="mt-3"></div>
</div>
<script>
    var btnFuturas = document.getElementById('btn-futuras');
    var btnCurso = document.getElementById('btn-curso');
    var btnFuturasCerradas = document.getElementById('btn-futuras-cerradas');
    var btnCursoCerradas = document.getElementById('btn-curso-cerradas');
    var listado = document.getElementById('listado-chats');
    var chatsFuturo = {{ chats_futuro|tojson }};
    var chatsCurso = {{ chats_curso|tojson }};
    var chatsFuturoCerradas = {{ chats_futuro_cerradas|tojson }};           
    var chatsCursoCerradas = {{ chats_curso_cerradas|tojson }};

    function renderChats(chats, titulo) {
        if (chats.length === 0) {
            listado.innerHTML = '<div class="alert alert-info text-center">No hay chats para mostrar.</div>';
            return;
        }
        var html = '<h5>' + titulo + '</h5><ul class="list-group">';
        chats.forEach(function(chat) {
            html += '<li class="list-group-item d-flex justify-content-between align-items-center">' +
                '<div style="display: flex; gap: 1rem;">' +
                    '<span><strong>Propiedad:</strong> ' + chat.casa_nombre + '</span>' +
                    '<span><strong>Fecha de inicio:</strong> ' + chat.fecha_inicio + '</span>' +
                    '<span><strong>Fecha de fin:</strong> ' + chat.fecha_fin + '</span>' +
                    '<span><strong>Cliente:</strong> ' + chat.cliente_nombre + '</span>' +
                '</div>' +
                '<a href="/chat?conversacion_id=' + chat.id + '&cliente_nombre=' + encodeURIComponent(chat.cliente_nombre) + '" class="btn btn-sm btn-outline-primary">Ver chat</a>' +
                '</li>';
        });
        html += '</ul>';
        listado.innerHTML = html;
    }

    btnFuturas.onclick = function() {
        renderChats(chatsFuturo, 'Chats con reservas a futuro');
    };
    btnCurso.onclick = function() {
        renderChats(chatsCurso, 'Chats con reservas en curso');
    };
    btnFuturasCerradas.onclick = function() {
        renderChats(chatsFuturoCerradas, 'Chats con reservas a futuros cerrados');
    };
    btnCursoCerradas.onclick = function() {
        renderChats(chatsCursoCerradas, 'Chats con reservas en curso cerrados');
    };
</script>
{% endblock %}
